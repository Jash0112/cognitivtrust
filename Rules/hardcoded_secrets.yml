rules:
  - id: hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: $VAR = "$..."
          - pattern: $VAR = '...'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(key|token|secret|passwd|password|credentials).*
    message: "Possible hardcoded secret detected in variable name."
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"